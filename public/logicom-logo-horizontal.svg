<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 48" width="100%" height="100%">
  <defs>
    <!-- Vibrant Emerald / Neon Lime Gradient for Top Blade -->
    <linearGradient id="logicomHGreen" x1="0%" y1="70%" x2="100%" y2="20%">
      <stop offset="0%" stop-color="#00C853" />
      <stop offset="50%" stop-color="#00E676" />
      <stop offset="100%" stop-color="#00F59B" />
    </linearGradient>

    <!-- Electric Cyan Gradient for Bottom Blade -->
    <linearGradient id="logicomHCyan" x1="0%" y1="50%" x2="100%" y2="50%">
      <stop offset="0%" stop-color="#00B4D8" />
      <stop offset="60%" stop-color="#00D2FF" />
      <stop offset="100%" stop-color="#38E1FF" />
    </linearGradient>
  </defs>

  <!-- Wing Emblem Group (Left Side) -->
  <g transform="translate(0, 4) scale(0.68)">
    <!-- Speed Streaks -->
    <line x1="42" y1="12" x2="68" y2="6" stroke="#00E676" stroke-width="2.6" stroke-linecap="round" />
    <line x1="28" y1="20" x2="33" y2="20" stroke="#00C853" stroke-width="2" stroke-linecap="round" />

    <!-- Top Blade -->
    <path d="M 8 36 L 78 6 L 66 18 L 22 34 Z" fill="url(#logicomHGreen)" />

    <!-- Bottom Blade -->
    <path d="M 23 37 Q 44 37 70 26 L 62 37 Q 40 42 23 37 Z" fill="url(#logicomHCyan)" />
  </g>

  <!-- Typography: Logi coM (Right Side) -->
  <g transform="translate(62, 33)">
    <!-- "Logi" Slanted / Italic Sans-Serif -->
    <text x="0" y="0" font-family="'Plus Jakarta Sans', 'Inter', -apple-system, sans-serif" font-style="italic" font-weight="800" font-size="28" fill="#0A1931" letter-spacing="-0.02em">Logi</text>
    <!-- "coM" Upright Bold Tech Sans-Serif -->
    <text x="70" y="0" font-family="'Plus Jakarta Sans', 'Inter', -apple-system, sans-serif" font-style="normal" font-weight="800" font-size="28" fill="#0A1931" letter-spacing="-0.01em">co<tspan font-size="22" dy="-1.5">M</tspan></text>
  </g>
</svg>
