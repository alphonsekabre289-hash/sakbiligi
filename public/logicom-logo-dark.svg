<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 270 92" width="100%" height="100%">
  <defs>
    <!-- Vibrant Emerald / Neon Lime Gradient for Top Blade -->
    <linearGradient id="logicomGreenDark" x1="0%" y1="70%" x2="100%" y2="20%">
      <stop offset="0%" stop-color="#00D26A" />
      <stop offset="50%" stop-color="#00E676" />
      <stop offset="100%" stop-color="#00F59B" />
    </linearGradient>

    <!-- Electric Cyan Gradient for Bottom Blade -->
    <linearGradient id="logicomCyanDark" x1="0%" y1="50%" x2="100%" y2="50%">
      <stop offset="0%" stop-color="#00B4D8" />
      <stop offset="60%" stop-color="#00D2FF" />
      <stop offset="100%" stop-color="#38E1FF" />
    </linearGradient>
  </defs>

  <!-- Speed Streaks (Top Left of wing) -->
  <line x1="108" y1="21" x2="148" y2="12" stroke="#00E676" stroke-width="2.6" stroke-linecap="round" />
  <line x1="92" y1="31" x2="98" y2="31" stroke="#00D26A" stroke-width="2" stroke-linecap="round" />

  <!-- Dynamic Aerodynamic Wing - Top Green Blade -->
  <path d="M 68 50 L 208 14 L 184 35 L 94 48 Z" fill="url(#logicomGreenDark)" />

  <!-- Dynamic Aerodynamic Wing - Bottom Cyan Blade -->
  <path d="M 96 52 Q 138 52 188 38 L 172 52 Q 130 58 96 52 Z" fill="url(#logicomCyanDark)" />

  <!-- Typography: Logi coM (White text for Dark Backgrounds matching screenshot) -->
  <g transform="translate(10, 84)">
    <!-- "Logi" Slanted / Italic Sans-Serif -->
    <text x="0" y="0" font-family="'Plus Jakarta Sans', 'Inter', -apple-system, sans-serif" font-style="italic" font-weight="800" font-size="38" fill="#FFFFFF" letter-spacing="-0.02em">Logi</text>
    <!-- "coM" Upright Bold Tech Sans-Serif with small-caps style M -->
    <text x="96" y="0" font-family="'Plus Jakarta Sans', 'Inter', -apple-system, sans-serif" font-style="normal" font-weight="800" font-size="38" fill="#FFFFFF" letter-spacing="-0.01em">co<tspan font-size="30" dy="-1.5">M</tspan></text>
  </g>
</svg>
